name: Embedder

# The embedder's own tests, with the real model, inside its Docker image: on every pull request and
# push to main that changes the embedder (or this file). Once on Intel and once on ARM, so both
# locked package lists install.
on:
  push:
    branches: [main]
    paths: ["apps/embedder/**", ".dockerignore", ".github/workflows/embedder.yml"]
  pull_request:
    paths: ["apps/embedder/**", ".dockerignore", ".github/workflows/embedder.yml"]

permissions:
  contents: read

concurrency:
  group: embedder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  embedder-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image installs the locked versions (torch as its CPU-only build), every file checked by hash.
      - name: Build the embedder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/embedder/Dockerfile
          tags: ink-embedder:ci
          load: true
          cache-from: type=gha,scope=embedder-${{ matrix.runner }}
          cache-to: type=gha,scope=embedder-${{ matrix.runner }},mode=max

      # The model (about 2 GB) at its pinned revision, kept between runs.
      - name: Keep the model between runs
        uses: actions/cache@v4
        with:
          path: .hf
          key: bge-m3-9a0624b896d81da7492a910ffa53731274b6cf3d

      - name: Run the tests in the image
        run: |
          mkdir -p .hf
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e EMBEDDER_HOST=127.0.0.1 \
            -v "$PWD/.hf:/models" ink-embedder:ci python -m unittest discover -v -p "test_*.py"
