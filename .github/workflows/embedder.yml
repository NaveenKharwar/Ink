name: Embedder

# The embedder's own tests, with the real model: on every pull request and push to main that changes
# the embedder (or this file).
on:
  push:
    branches: [main]
    paths: ["apps/embedder/**", ".github/workflows/embedder.yml"]
  pull_request:
    paths: ["apps/embedder/**", ".github/workflows/embedder.yml"]

permissions:
  contents: read

concurrency:
  group: embedder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  embedder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/embedder
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The same versions as the embedder runs with, torch as its CPU-only build, every file checked by hash.
      - name: Install the locked packages
        run: |
          python -m pip install --upgrade pip==26.0.1
          pip install --require-hashes --no-deps -r requirements-ci.txt
          pip check
      # The model (about 2 GB) at its pinned revision, kept between runs.
      - name: Keep the model between runs
        uses: actions/cache@v4
        with:
          path: .hf
          key: bge-m3-9a0624b896d81da7492a910ffa53731274b6cf3d
      - name: Run the tests
        run: python -m unittest discover -v -p "test_*.py"
