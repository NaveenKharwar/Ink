name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

# A push to a pull request cancels the runs it supersedes. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps private planning, tooling and assistant traces out of the public repo (files, commits, branch name).
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the repo
        env:
          BASE: ${{ github.base_ref }}
        run: .github/hygiene.sh ${BASE:+origin/$BASE}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The database tests and the Bruno privacy and token checks: two writers against a real local Supabase
  # (database, sign-in, storage), the real API, and a stand-in embedder. Fails the PR if one writer
  # can reach another's writing, or a bad token gets in.
  api-checks:
    # A fixed Ubuntu: the browser tests need one Playwright supports (it does not support 26.04 yet).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the shared schemas
        run: pnpm --filter @ink/schemas build

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start a local Supabase
        run: |
          supabase init --force
          supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply the migrations and create two writers
        run: apps/api/ci/prepare.sh

      # The real repository code against this database (every migration, pgvector, pgroonga):
      # each test makes its own throwaway writers and deletes them.
      - name: Database tests
        run: pnpm --filter @ink/api test:db

      - name: Make an expired token
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          token="$(node apps/api/ci/mint-expired-token.mjs)"
          echo "::add-mask::$token"
          echo "EXPIRED_TOKEN=$token" >> "$GITHUB_ENV"

      # The API and the web app run from their Docker images (the same ones compose.yaml starts),
      # on the runner's network so they reach the local Supabase and the stand-in embedder.
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ink-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ink-web:ci
          load: true
          build-args: |
            SUPABASE_URL=${{ env.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Start the stand-in embedder and the API
        run: |
          nohup pnpm --filter @ink/api exec tsx ci/fake-embedder.ts > fake-embedder.log 2>&1 &
          mkdir -p apps/api/logs
          docker run -d --name api --network host --user "$(id -u):$(id -g)" \
            -v "$PWD/apps/api/logs:/app/apps/api/logs" \
            -e NODE_ENV=development -e EMBEDDER_URL=http://127.0.0.1:8001 -e EMBED_QUIET_SECONDS=1 \
            -e SUPABASE_URL -e SUPABASE_SERVICE_ROLE_KEY -e DATABASE_URL \
            ink-api:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && exit 0
            sleep 1
          done
          echo "The API did not start"; docker logs api; exit 1

      - name: Run the Bruno collection
        run: npx --yes @usebruno/cli@4.2.1 run --env Local --reporter-json "$GITHUB_WORKSPACE/bruno-results.json"
        working-directory: apps/api/bruno

      # The browser tests: the web image (built against this local Supabase, served by Caddy, /api
      # passed to the API) in Chromium, signed in through the real screens as the second writer.
      # A security-policy block or page error fails them.
      - name: Serve the web app
        run: |
          docker run -d --name web --network host -e SITE_ADDRESS=:4173 -e API_UPSTREAM=localhost:3001 ink-web:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              # An address that is not a file gets the app, and /api reaches the API.
              curl -sf http://localhost:4173/all | grep -q '<div id="root"' || { echo "/all did not get the app"; exit 1; }
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/api/pieces)
              [ "$code" = 401 ] || { echo "/api/pieces answered $code, expected 401"; exit 1; }
              # A missing built file is a 404, never the app page.
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/assets/missing.js)
              [ "$code" = 404 ] || { echo "/assets/missing.js answered $code, expected 404"; exit 1; }
              # The app page always asks for the latest version; built files are kept for a year.
              curl -sI http://localhost:4173/ | grep -qi '^cache-control: no-cache' || { echo "/ has no Cache-Control: no-cache"; exit 1; }
              asset=$(curl -s http://localhost:4173/ | grep -o '/assets/[^"]*\.js' | head -1)
              curl -sI "http://localhost:4173$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable' || { echo "$asset is not cached for a year"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "The web app did not start"; docker logs web; exit 1

      # The tests run headless, so they only need Chromium's headless shell. It is kept between runs,
      # one copy per Playwright version, so a slow download can't hold up the run; the system
      # libraries it needs are installed every time.
      - name: Find the Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @ink/web exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @ink/web exec playwright install-deps chromium

      - name: Browser tests
        env:
          E2E_EMAIL: ${{ env.SECOND_EMAIL }}
          E2E_PASSWORD: ${{ env.SECOND_PASSWORD }}
          E2E_REQUIRE_SIGN_IN: "1"
        run: pnpm --filter @ink/web e2e

      - name: The embeddings were really made
        if: always()
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          count=$(psql "$DB_URL" -tA -c "select count(*) from public.piece_embeddings")
          echo "embeddings: $count"
          echo "Meaning vectors made during the run: $count. The privacy checks only mean something if there were some." > embeddings.md
          [ "$count" -ge 4 ]

      - name: Write the summary
        if: always()
        run: |
          {
            node apps/api/ci/summary.mjs bruno-results.json short
            echo
            cat embeddings.md 2>/dev/null || true
          } > summary.md
          {
            node apps/api/ci/summary.mjs bruno-results.json
            echo
            cat embeddings.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, edited on every run, so the latest result is always right there.
      - name: Post the summary on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- api-checks -->"
            cat summary.md
            echo
            echo "[Every check]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · commit ${GITHUB_SHA::7}"
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- api-checks -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

      - name: Logs
        if: failure()
        run: |
          docker logs api > api.out.log 2>&1 || true
          docker logs web > web.out.log 2>&1 || true
          echo "--- API"; tail -n 200 api.out.log || true
          echo "--- embedder"; tail -n 50 fake-embedder.log || true
          echo "--- web"; tail -n 50 web.out.log || true

      # The whole logs and the Bruno report, to download from the run page when a check fails.
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-check-logs
          path: |
            api.out.log
            fake-embedder.log
            apps/api/logs/api.log
            bruno-results.json
            web.out.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
