    <script>
      // Apply the writer's colour scheme before the page paints, so it never flashes.
      // (A stored moss, or ink-theme light, reads as Saffron; ink-theme dark reads as Night.)
      try {
        var names = ["saffron", "paper", "night"];
        var s = localStorage.getItem("ink-scheme");
        var old = localStorage.getItem("ink-theme");
        if (s === "moss") s = "saffron";
        if (names.indexOf(s) < 0) s = old === "dark" ? "night" : old === "light" ? "saffron" : null;
        if (s) document.documentElement.dataset.scheme = s;
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
