<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink</title>
    <script>
      // Apply the writer's colour scheme before the page paints, so it never flashes.
      // (The earlier Light / Dark choice, ink-theme, becomes Moss / Night.)
      try {
        var names = ["moss", "sky", "paper", "night"];
        var s = localStorage.getItem("ink-scheme");
        var old = localStorage.getItem("ink-theme");
        if (names.indexOf(s) < 0) s = old === "dark" ? "night" : old === "light" ? "moss" : null;
        if (s) document.documentElement.dataset.scheme = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
